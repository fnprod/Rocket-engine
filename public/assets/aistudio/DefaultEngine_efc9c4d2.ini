[Portal.SelfUpdate]
RefreshTimeMin=14400
RefreshTimeMax=28800

; Overridable by an EMS hotfix INI.
;   DetectionEnabled           - probe for an EGLv2 install at all.
;   BlockLauncherWhenInstalled - block startup when EGLv2 is installed.
;   AllowAutoLaunch            - offer "Switch to the New Launcher"; false offers "Quit" instead.
;   MinBlockingVersion         - only block on EGLv2 at or above this version; empty blocks on any.
;                                Rollback lever for the block. NOTE: a machine whose EGLv2
;                                version cannot be read blocks whatever this is set to, so no
;                                value here unblocks a Mac user - Mac detection reports no
;                                version at all.
[Portal.EGLv2]
DetectionEnabled=true
BlockLauncherWhenInstalled=true
AllowAutoLaunch=true
MinBlockingVersion=
; Re-check for a v2 install that appeared after startup, including one still installing. 0 disables.
BlockRecheckIntervalSec=60
; Upgrade flow. Off by default so rollout is driven entirely by hotfix.
;   UpgradeUserBasePercentage   - fraction of machines in the rollout; 0.0 nobody, 1.0 everyone.
;   Upgrade*Enabled             - per-surface switches, for a staged rollout.
;   UpgradeModalForced          - modal cannot be dismissed and offers no "Later".
;   UpgradeRenagAfterHours      - re-offer this long after a decline; 0 never re-offers.
;   UpgradeToastIntervalHours   - minimum gap between tray toasts; 0 shows one per session.
;   UpgradeToastMaxCount        - stop toasting after this many; 0 is unlimited.
;   UpgradeInstallerPath*       - installer filename, per platform.
UpgradeUserBasePercentage=0.0
UpgradeSettingsEntryEnabled=false
UpgradeBannerEnabled=false
UpgradeModalEnabled=false
UpgradeModalForced=false
UpgradeToastEnabled=false
UpgradeToastIntervalHours=24
UpgradeToastMaxCount=0
UpgradeToastDurationSec=30
UpgradeRenagAfterHours=168
UpgradeMinFreeSpaceMB=4096
UpgradeInstallTimeoutSec=900
UpgradeRequireSignature=true
UpgradeSignatureCompanyPrefix=Epic Games
;   UpgradePrefetchEnabled      - quietly pre-download the installer; only for the rollout cohort.
;   UpgradePrefetchDelaySec     - wait this long after startup before prefetching.
;   UpgradeInstallerUrl         - source for the Http mode. Epic-internal, needs VPN.
UpgradePrefetchEnabled=false
UpgradePrefetchDelaySec=300
UpgradeDownloadTimeoutSec=900
; Quoted: an unquoted value is truncated at "//", which the config parser treats as a comment.
UpgradeInstallerUrl="https://content-download-egs.distro.on.epicgames.com/Builds/EGLv2/0.75.0%2Bga3f5f92/Windows/EGLv2Setup.exe?launcherfilename=EGLv2Setup.exe"
UpgradeInstallerPathWindows=EGLv2/EGLv2Setup.exe
UpgradeInstallerArgsWindows=/S
UpgradeInstallerElevateWindows=true

