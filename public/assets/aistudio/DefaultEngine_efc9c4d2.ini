[Portal.Social]
ActivateNewSocial=true
UseEOSSDKSocial=true
UseEGLDrivenPresence=false
; EOS login attempts per failure episode before auto-retry stops. An episode normally mints one
; account session because the token is reused, but a fatal re-mints, so the ladder stays bounded.
; Charged only when UseEOSSDKSocial=true; the reader clamps to 2..100 so one retry always remains.
EOSLoginMaxAttemptsPerEpisode=10

[Portal.QuietTime]
; Sends the host time zone to K3S after sign-in, for Quiet Time notification suppression
; On by default; EMS can switch it off or ramp it, and both keys are read on every send
bSendTimeZoneOnSignIn=true
SendTimeZoneFraction=1.0
; Hours before an unchanged time zone K3S already took is sent again; 0 sends it once per sign-in, ignoring earlier sessions
ResendTimeZoneAfterHours=24
; Holds desktop toasts during Quiet Time for QuietHoursAudience: K3SQuietTime (the users K3S applies Quiet Time to;
; minor status until it answers), AllUsers, Minors, or None to switch it off. An unrecognised value means K3SQuietTime
QuietHoursAudience=K3SQuietTime
; Quiet Time follows the user's K3S schedule when K3S has one, and these local hours otherwise.
; bUseK3SSchedule=false always uses these hours, and only K3SQuietTime still asks K3S
bUseK3SSchedule=true
QuietHoursStart=22:00
QuietHoursEnd=06:00
; Per EAppNotificationType, what happens to its toasts during Quiet Time: Allow shows them, Enqueue holds them and shows
; them once Quiet Time ends (by the clock, or as soon as a K3S or EMS update ends it early), Suppress drops them.
; A type with no entry, or an unrecognised value, uses DefaultNotificationPolicy (Suppress if that's unset too)
DefaultNotificationPolicy=Suppress
NotificationPolicy.NewEngine=Allow
NotificationPolicy.Update=Allow
NotificationPolicy.Ready=Allow
NotificationPolicy.FriendRequest=Suppress
NotificationPolicy.Info=Suppress
NotificationPolicy.Message=Suppress
NotificationPolicy.BuildNotification=Enqueue
NotificationPolicy.InstallNotification=Allow
NotificationPolicy.SocialNotification=Suppress
NotificationPolicy.MarketingNotification=Enqueue
; While the launcher has focus, these replace NotificationPolicy, so friend requests and game invites show to a user
; who's in the launcher. Game invites arrive as Message (classic social) or SocialNotification (the social overlay,
; which also carries its chat messages)
ForegroundNotificationPolicy.FriendRequest=Allow
ForegroundNotificationPolicy.Message=Allow
ForegroundNotificationPolicy.SocialNotification=Allow
; Desktop toast outcome analytics (Launcher.QuietTime.ToastOutcome), for accounts K3S gives a Quiet Time schedule. Only types
; listed here are reported, under the category given; a type with no entry is never reported (e.g. the exempt NewEngine, Update,
; Ready and InstallNotification, and SocialNotification, which Social Overlay reports itself). Analytics only: changes no toast
bSendToastOutcomeAnalytics=true
ToastAnalyticsCategory.FriendRequest=FRIEND-INVITE
ToastAnalyticsCategory.Message=GAME INVITE
ToastAnalyticsCategory.MarketingNotification=MARKETING
ToastAnalyticsCategory.BuildNotification=MARKETING
ToastAnalyticsCategory.Info=INFO
; K3SQuietTime only: whether minor status decides until K3S answers
bUseMinorStatusWhenK3SUnknown=true
; K3SQuietTime only: after sign-in, toasts that aren't Allow wait up to this long for K3S's first answer rather than going
; by minor status, since K3S also gives Quiet Time to 13-17s who aren't minors. K3S normally answers within a second
K3SAnswerWaitSeconds=10
; How old K3S's Quiet Time answer must be before a reconnect, token refresh or EMS change asks K3S again (sign-in always asks).
; There's no timer: an older answer is only refreshed at the next of those. Zero or less means the default
K3SAnswerRefreshSeconds=3600
; The K3S setting asked for the user's schedule and eligibility
QuietTimeSettingNamespace=communications
QuietTimeSettingNames=notification-quiet-time,curtain-tower

